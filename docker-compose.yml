services:
  postgres:
    image: postgres:16-alpine
    container_name: fadiga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fadiga}
      POSTGRES_USER: ${POSTGRES_USER:-fadiga_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fadiga_app} -d ${POSTGRES_DB:-fadiga}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monitoramento

  grafana:
    image: grafana/grafana:11.6.0
    container_name: fadiga-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-troque_esta_senha_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: America/Sao_Paulo
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard_monitoramento_fadiga.json:/var/lib/grafana/dashboards/dashboard_monitoramento_fadiga.json:ro
    networks:
      - monitoramento

volumes:
  postgres_data:
  grafana_data:

networks:
  monitoramento:
    driver: bridge
